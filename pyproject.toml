[project]
name = "agentreins"
version = "0.1.0.dev0"
description = "A small, durable, provider-neutral agent runtime: event-sourced, crash-safe, human-in-the-loop."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Xiaoyin Bai" }]
keywords = ["agents", "llm", "tool-calling", "durable-execution", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Dependency policy (see ARCHITECTURE.md): the core depends on pydantic only.
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
# Provider adapters speak raw HTTP; no vendor SDKs.
providers = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/baihahaha/agentreins"
Issues = "https://github.com/baihahaha/agentreins/issues"
Changelog = "https://github.com/baihahaha/agentreins/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentreins"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
extraPaths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared test helpers, e.g. builders.py
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["live: calls a real model provider (opt-in, needs API keys)"]

[tool.coverage.run]
source = ["agentreins"]
branch = true
