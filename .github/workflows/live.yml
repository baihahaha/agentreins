name: Live

# Tests against real model providers (marked `live`). Never on pull requests:
# they cost money and need the provider key, stored as a repository secret.
on:
  schedule:
    - cron: "0 3 * * *" # every night, 03:00 UTC
  workflow_dispatch: # or run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --all-extras
      # Exit code 5 means "no tests collected": fine until the first live test exists.
      - run: uv run pytest -m live -v || [ $? -eq 5 ]
