name: Live

# Tests against real model providers (marked `live`). Never on pull requests:
# they cost money and need the provider key, stored as a repository secret.
on:
  schedule:
    - cron: "0 3 * * *" # every night, 03:00 UTC
  workflow_dispatch: # or run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked --all-extras
      # Exit code 5 means "no tests collected": fine until the first live test exists.
      - run: uv run pytest -m live -v || [ $? -eq 5 ]
